name: Build MSIX for Microsoft Store

# Builds only the Windows Store package. electron-builder outputs an .appx
# package, which is the MSIX package format accepted by Partner Center.
# Usage: Actions → "Build MSIX for Microsoft Store" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  build-msix:
    name: Build GDW Mirror Store package (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Store package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win:store -- --publish never
      - name: List Store packages
        shell: pwsh
        run: Get-ChildItem -Recurse dist/store -Filter *.appx | Select-Object FullName, Length
      - uses: actions/upload-artifact@v7
        with:
          name: GDW_Mirror-MSIX
          path: dist/store/*.appx
          if-no-files-found: error
          retention-days: 14
