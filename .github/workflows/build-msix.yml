name: Build Windows dual app

# Compila el instalador y la versión portable de la aplicación dual para Windows.
# Build the Windows installer and portable version of the dual-role app.
# Uso / Usage: Actions → "Build Windows dual app" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  build-windows:
    name: Compilar aplicación dual (x64) / Build dual app (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias / Install dependencies
        run: npm ci
      - name: Compilar / Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --publish never
      - name: Listar artefactos / List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse dist/dual -Filter *.exe | Select-Object FullName, Length
      - uses: actions/upload-artifact@v7
        with:
          name: GDW-Mirror-Windows-dual
          path: dist/dual/*.exe
          if-no-files-found: error
          retention-days: 14
