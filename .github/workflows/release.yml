name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ej. v0.2.0). Debe existir.'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  meta:
    name: Leer versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Obtener versión de package.json
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $VERSION"

  build-mac:
    name: Compilar macOS (arm64 + x64)
    needs: meta
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar host (arm64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Firma: Developer ID (certificado presente)"
            npx electron-builder --config builder/host.yml --mac zip --publish never --config.mac.identity=""
          else
            echo "Firma: ad-hoc (sin certificado)"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --config builder/host.yml --mac zip --publish never
          fi

      - name: Compilar host (x64 Intel)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Firma: Developer ID (certificado presente)"
            npx electron-builder --config builder/host.yml --mac zip --x64 --publish never --config.mac.identity=""
          else
            echo "Firma: ad-hoc (sin certificado)"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --config builder/host.yml --mac zip --x64 --publish never
          fi

      - name: Verificar firma (ambas)
        run: |
          for APP in $(find dist/host -maxdepth 2 -name '*.app' -type d); do
            echo "App: $APP"
            codesign --verify --deep --strict "$APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Signature|Authority'
          done

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/host/*.zip
          if-no-files-found: error
          retention-days: 5

  build-win:
    name: Compilar Windows (x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar receptor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config builder/viewer.yml --win portable --x64 --publish never

      - name: Compilar paquete MSIX (para Microsoft Store)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config builder/viewer.yml --win appx --x64 --publish never

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: win
          path: dist/viewer/*.exe
          if-no-files-found: error
          retention-days: 5

      - name: Subir paquete MSIX
        uses: actions/upload-artifact@v7
        with:
          name: win-msix
          path: |
            dist/viewer/*.appx
            dist/viewer/*.msix
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publicar release
    needs: [meta, build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Descargar artefactos
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Aplanar y calcular SHA-256
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' \) -exec cp {} out/ \;
          ls -lh out/
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Crear o actualizar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -e
          if [ -f builder/RELEASE-NOTES.md ]; then
            cp builder/RELEASE-NOTES.md notes.md
          else
            printf 'Release %s\n' "$VERSION" > notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe: se actualizan los archivos."
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" out/* \
              --title "GDW Mirror $VERSION" \
              --notes-file notes.md
          fi

      - name: Resumen
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          {
            echo "## Release $TAG publicado"
            echo ""
            echo "| Archivo | Tamaño |"
            echo "| --- | --- |"
            for f in out/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
