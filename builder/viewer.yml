appId: com.gdw.mirror.view
productName: GDW Mirror View
copyright: Copyright © 2026 José Cruz Chávez · GDW · https://gdw.mx

directories:
  output: dist/viewer
  buildResources: build

files:
  - package.json
  - src/**/*

extraMetadata:
  main: src/entry-viewer.js

asar: true

win:
  icon: build/icon.png
  target:
    - portable
    - zip
    - appx

appx:
  applicationId: GDWMirrorView
  identityName: JosCruzChvez.GDWMirrorView
  publisher: CN=0711A566-87BA-4116-8D0A-B2E7DB8586BF
  publisherDisplayName: José Cruz Chávez
  displayName: GDW Mirror View
  backgroundColor: "#08080a"
  capabilities:
    - runFullTrust
    - privateNetworkClientServer
  minVersion: 10.0.17763.0
  addAutoLaunchExtension: false

mac:
  category: public.app-category.utilities
  icon: build/icon.png
  identity: null
  target:
    - zip

linux:
  target:
    - AppImage

portable:
  artifactName: GDW-Mirror-View-${version}-${arch}-portable.exe

artifactName: GDW-Mirror-View-${version}-${arch}.${ext}
