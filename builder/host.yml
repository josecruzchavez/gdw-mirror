appId: com.gdw.mirror.host
productName: GDW Mirror Host
copyright: Copyright © 2026 José Cruz Chávez · GDW · https://gdw.mx

directories:
  output: dist/host
  buildResources: build

files:
  - package.json
  - src/**/*

extraMetadata:
  main: src/entry-host.js

asar: true

mac:
  category: public.app-category.utilities
  icon: build/icon.png
  # "-" = firma ad-hoc (por defecto). En el workflow, cuando existe el
  # certificado (secret CSC_LINK), se hace override a autodescubrimiento.
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - zip
    - dmg
  extendInfo:
    LSUIElement: true
    NSHighResolutionCapable: true

win:
  target:
    - zip

linux:
  target:
    - dir

artifactName: GDW-Mirror-Host-${version}-${arch}.${ext}
